<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Agenda</title>
<meta name="theme-color" content="#EDEFE9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--papel:#EDEFE9;--papel2:#F5F6F1;--tinta:#16211E;--tinta2:#5D6862;--tinta3:#98A099;
    --linha:#D4D8CF;--carimbo:#5B3A8B;--fraco:#5B3A8B1A;--falha:#A6453F;--falhaFraco:#A6453F14;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#E2E5DD}
  body{font-family:var(--sans);color:var(--tinta);-webkit-tap-highlight-color:transparent}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--papel);font-size:16px;line-height:1.45;position:relative;border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
  .boot{font-family:var(--mono);font-size:12px;color:var(--tinta3);padding:48px;text-align:center}

  .topo{padding:14px 16px 12px;border-bottom:2px solid var(--tinta);position:relative;overflow:hidden}
  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta3)}
  .data{font-family:var(--serif);font-size:23px;line-height:1.15;margin:2px 0 0;padding-right:96px;font-weight:600}
  .tallyLinha{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding-right:96px}
  .tally{display:flex;gap:3px;flex-wrap:wrap}
  .tally i{width:8px;height:13px;border:1px solid var(--linha);display:block}
  .tally i.on{background:var(--carimbo);border-color:var(--carimbo)}
  .tally i.mn{background:var(--fraco);border-color:var(--carimbo)}
  .tally i.no{background:var(--falhaFraco);border-color:var(--falha)}
  .contagem{font-family:var(--mono);font-size:10.5px;color:var(--tinta2);white-space:nowrap}
  .carimbo{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-9deg);border:2px solid var(--carimbo);border-radius:3px;padding:5px 9px 4px;color:var(--carimbo);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-align:center;opacity:.82;pointer-events:none;line-height:1.25;box-shadow:inset 0 0 0 1px var(--papel),inset 0 0 0 3px var(--carimbo)}
  .carimbo small{display:block;font-size:7.5px;font-weight:400;letter-spacing:.1em;opacity:.8;margin-top:1px}
  .carimbo.entra{animation:pressiona .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pressiona{0%{opacity:0;transform:translateY(-50%) rotate(-9deg) scale(2);filter:blur(3px)}60%{opacity:.95;filter:blur(0)}100%{opacity:.82;transform:translateY(-50%) rotate(-9deg) scale(1)}}

  .abas{display:flex;border-bottom:1px solid var(--linha);background:var(--papel2);position:sticky;top:0;z-index:30}
  .abas button{flex:1;appearance:none;background:none;border:0;border-right:1px solid var(--linha);padding:14px 1px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);cursor:pointer}
  .abas button:last-child{border-right:0}
  .abas button[aria-selected=true]{color:var(--tinta);background:var(--papel);box-shadow:inset 0 -2px 0 var(--carimbo)}

  .cronobar{position:sticky;top:44px;z-index:25;background:var(--carimbo);color:var(--papel);display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:var(--mono);font-size:12px}
  .cronobar .nome{flex:1;font-family:var(--sans);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cronobar b{font-size:15px}
  .cronobar button{appearance:none;background:transparent;border:1.5px solid var(--papel);color:var(--papel);border-radius:3px;padding:7px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

  .painel{padding:14px 16px 40px}
  .vazio{text-align:center;padding:38px 12px}
  .vazio h3{font-family:var(--serif);font-size:21px;margin:0 0 8px}
  .vazio p{color:var(--tinta2);font-size:15px;margin:0 0 20px}

  .proxima{border:1px solid var(--carimbo);border-radius:4px;padding:11px 12px;margin-bottom:12px;background:var(--fraco);display:flex;align-items:center;gap:10px}
  .proxima .qq{flex:1;min-width:0}
  .proxima .et{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--carimbo)}
  .proxima .tt{font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proxima .cd{font-family:var(--mono);font-size:16px;color:var(--carimbo);white-space:nowrap}

  .grupo{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3);margin:22px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:8px}
  .grupo:first-child{margin-top:2px}

  .linha{display:grid;grid-template-columns:46px 1fr 30px;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linha)}
  .linha .alvo{cursor:pointer;min-width:0}
  .hora{font-family:var(--mono);font-size:12px;color:var(--tinta2)}
  .titulo{font-size:15.5px;line-height:1.3}
  .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .cat{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px;border:1px solid currentColor;border-radius:2px}
  .faixa{font-family:var(--mono);font-size:9.5px;color:var(--tinta3)}
  .minimo{font-size:12px;color:var(--tinta3);font-style:italic}
  .marca{font-family:var(--mono);font-size:10px;color:var(--carimbo)}
  .marcaN{font-family:var(--mono);font-size:10px;color:var(--falha)}
  .pill{appearance:none;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;padding:4px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);cursor:pointer}
  .pill:active{background:var(--linha)}
  .pill.rox{color:var(--carimbo);border-color:#5B3A8B44}
  .pill.rub{color:var(--falha);border-color:#A6453F44}
  .caixa{width:26px;height:26px;border:1.5px solid var(--tinta3);border-radius:3px;justify-self:end;position:relative;cursor:pointer}
  .linha.feito .caixa{background:var(--carimbo);border-color:var(--carimbo)}
  .linha.feito .caixa::after{content:"";position:absolute;left:8.5px;top:3px;width:6px;height:13px;border:solid var(--papel);border-width:0 2px 2px 0;transform:rotate(42deg)}
  .linha.feito .titulo{text-decoration:line-through;color:var(--tinta3)}
  .linha.feito .hora,.linha.falho .hora{color:var(--tinta3)}
  .linha.falho{background:var(--falhaFraco)}
  .linha.falho .caixa{border-color:var(--falha)}
  .linha.falho .caixa::before,.linha.falho .caixa::after{content:"";position:absolute;left:11px;top:4px;width:1.8px;height:15px;background:var(--falha)}
  .linha.falho .caixa::before{transform:rotate(45deg)}
  .linha.falho .caixa::after{transform:rotate(-45deg)}
  .linha.falho .titulo{color:var(--tinta3)}
  .linha.impr{box-shadow:inset 3px 0 0 var(--carimbo);padding-left:8px;grid-template-columns:38px 1fr 30px}
  .linha.agora{box-shadow:inset 3px 0 0 var(--carimbo);padding-left:8px;background:#5B3A8B0A}
  .linha.pulada{opacity:.55}
  .linha.pulada .titulo{text-decoration:line-through dotted}

  .btn{appearance:none;background:transparent;border:1.5px solid var(--tinta);color:var(--tinta);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:13px 12px;border-radius:3px;cursor:pointer}
  .btn:active{background:var(--tinta);color:var(--papel)}
  .btn.cheio{background:var(--carimbo);border-color:var(--carimbo);color:var(--papel)}
  .btn.leve{border-color:var(--linha);color:var(--tinta2);border-width:1px}
  .btn.largo{width:100%}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--linha)}
  .acoes .btn{flex:1;min-width:128px}

  .campo{margin-top:20px}
  .campo>label,.rotulo{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta3);margin-bottom:7px}
  input[type=text],input[type=time],input[type=number],input[type=date],textarea,select{width:100%;background:var(--papel2);border:1px solid var(--linha);border-radius:3px;padding:12px 11px;font-family:var(--sans);font-size:16px;color:var(--tinta)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--carimbo);background:#fff}
  textarea{resize:vertical;min-height:62px}
  .prio{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .prio span{font-family:var(--mono);font-size:12px;color:var(--carimbo);width:14px;flex:none}
  .duo{display:flex;gap:9px}.duo>div{flex:1}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{appearance:none;background:var(--papel2);border:1px solid var(--linha);border-radius:16px;padding:9px 13px;font-family:var(--sans);font-size:13.5px;color:var(--tinta2);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
  .chip.dia{border-radius:3px;padding:9px 0;flex:1;min-width:34px;text-align:center;font-family:var(--mono);font-size:11px}

  .form{border:1px solid var(--tinta);border-radius:4px;padding:15px;margin-top:14px;background:var(--papel2)}
  .form h4{font-family:var(--serif);font-size:18px;margin:0 0 13px}
  .form .campo:first-of-type{margin-top:0}
  .dica{font-size:12.5px;color:var(--tinta3);margin:5px 0 0;font-style:italic}
  .conflito{background:var(--falhaFraco);border-left:3px solid var(--falha);padding:11px 12px;margin-top:12px;font-size:13.5px}
  .conflito b{color:var(--falha);display:block;margin-bottom:4px}
  .conflito ul{margin:0 0 10px;padding-left:18px;color:var(--tinta2)}

  .grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0}
  .cel{border:1px solid var(--linha);border-radius:3px;padding:8px 1px 6px;text-align:center;background:var(--papel2)}
  .cel.hoje{border-color:var(--carimbo);border-width:1.5px}
  .cel b{display:block;font-family:var(--mono);font-size:9px;color:var(--tinta3);font-weight:400;text-transform:uppercase}
  .cel .pct{font-family:var(--serif);font-size:16px;color:var(--tinta3);line-height:1.5}
  .cel.ok .pct{color:var(--carimbo)}
  .cel .selo{font-family:var(--mono);font-size:7.5px;color:var(--carimbo);height:10px}

  .placar{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;padding:14px 0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
  .placar b{display:block;font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.1}
  .placar span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}

  .item{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linha);cursor:pointer;font-size:15px}
  .item .cx{width:22px;height:22px;border:1.5px solid var(--tinta3);border-radius:3px;position:relative}
  .item.feito .cx{background:var(--carimbo);border-color:var(--carimbo)}
  .item.feito .cx::after{content:"";position:absolute;left:7px;top:2px;width:5px;height:11px;border:solid var(--papel);border-width:0 2px 2px 0;transform:rotate(42deg)}
  .item.feito span{text-decoration:line-through;color:var(--tinta3)}

  .barra{height:7px;background:var(--linha);border-radius:4px;overflow:hidden;margin-top:5px}
  .barra i{display:block;height:100%;background:var(--carimbo)}
  .statLinha{padding:11px 0;border-bottom:1px solid var(--linha)}
  .statTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .statTopo b{font-weight:600;font-size:15px}
  .statTopo span{font-family:var(--mono);font-size:11px;color:var(--tinta2)}

  .intro{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--tinta2);margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--linha)}
  .verbete{padding:15px 0;border-bottom:1px solid var(--linha)}
  .verbete h4{margin:0 0 4px;font-family:var(--serif);font-size:17.5px}
  .verbete p{margin:0 0 6px;font-size:14.5px;color:var(--tinta2)}
  .verbete .fonte{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--tinta3);text-transform:uppercase}
  .passo{display:grid;grid-template-columns:26px 1fr;gap:11px;padding:12px 0;border-bottom:1px solid var(--linha)}
  .passo .n{font-family:var(--mono);font-size:11px;color:var(--carimbo);padding-top:3px}
  .passo p{margin:3px 0 0;font-size:14px;color:var(--tinta2)}
  .aviso{background:var(--fraco);border-left:3px solid var(--carimbo);padding:12px 13px;margin-top:16px;font-size:14.5px}
  .aviso.rub{background:var(--falhaFraco);border-color:var(--falha)}
  .rodape{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3);text-align:center;padding:16px;border-top:1px solid var(--linha)}
  .saida{width:100%;min-height:210px;font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre;overflow-x:auto}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="boot">abrindo…</div></div>
<script>
(function(){
"use strict";

var CHAVE="minha-agenda-v3";
var PALETA=["#2E6B54","#B0413E","#5B3A8B","#1F5673","#8A6D1F","#8B4A6B","#5D6862","#3F6B8A","#7A4B2A","#4A6B2E"];
var CATS_BASE=[{id:"TR",nome:"Trabalho",cor:"#2E6B54"},{id:"SA",nome:"Saúde",cor:"#B0413E"},
 {id:"FE",nome:"Fé",cor:"#5B3A8B"},{id:"ES",nome:"Estudo",cor:"#1F5673"},{id:"LE",nome:"Leitura",cor:"#8A6D1F"},
 {id:"RE",nome:"Relações",cor:"#8B4A6B"},{id:"CA",nome:"Casa",cor:"#5D6862"},{id:"PE",nome:"Pessoal",cor:"#3F6B8A"}];
var MOTIVOS=["Faltou tempo","Imprevisto","Cansaço","Esqueci","Escolhi não fazer"];
var RITUAL=["Listar tudo que está pendente na cabeça","Revisar a semana passada: o que andou, o que travou",
 "Olhar o calendário: compromissos fixos da semana","Escolher no máximo 3 prioridades da semana",
 "Marcar cada prioridade em um dia e uma hora","Decidir o que você NÃO vai fazer nesta semana"];
var DIAS_L=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
var DIAS_C=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var ORDEM=[1,2,3,4,5,6,0];
var CADAS={1:"Todo mês",2:"A cada 2 meses",3:"A cada 3 meses",4:"A cada 4 meses",6:"A cada 6 meses",12:"Uma vez por ano"};

var D=null,aba="hoje",vista=null,form=null,carimbou=false,periodo=28,catAberta=null;

/* ===== armazenamento ===== */
var Store={
  ler:function(k){
    try{ if(window.storage&&window.storage.get) return window.storage.get(k).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(k)); }catch(e){}
    return Promise.resolve(null);
  },
  gravar:function(k,v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(k,v).catch(function(e){console.warn(e);}); return; } }catch(e){}
    try{ window.localStorage.setItem(k,v); }catch(e){ console.warn("sem espaço",e); }
  }
};
function vazio(){return{v:3,categorias:CATS_BASE.slice(),tarefas:[],dias:{},semanas:{},timer:null,avisos:{ativo:false,antes:5}};}
function uid(){return"x"+Math.random().toString(36).slice(2,9);}
var pend=null;
function salvar(){var t=JSON.stringify(D);clearTimeout(pend);pend=setTimeout(function(){Store.gravar(CHAVE,t);},300);}

/* migração do modelo antigo (7 listas por dia da semana) */
function migrar(o){
  var n={v:3,categorias:o.categorias||CATS_BASE.slice(),tarefas:[],dias:o.dias||{},semanas:o.semanas||{},
    timer:null,avisos:o.avisos||{ativo:false,antes:5}};
  var mapa={},idMap={};
  for(var g=0;g<7;g++){
    (o.rotina&&o.rotina[g]||[]).forEach(function(t){
      var ch=[t.titulo,t.hora,t.cat,t.dur||0,t.minimo||""].join("§");
      if(mapa[ch]){ if(mapa[ch].rec.dias.indexOf(g)<0)mapa[ch].rec.dias.push(g); idMap[t.id]=mapa[ch].id; }
      else{
        var nt={id:t.id,titulo:t.titulo,hora:t.hora,dur:t.dur||0,cat:t.cat,minimo:t.minimo||"",
          projeto:false,rec:{tipo:"semanal",dias:[g]},inicio:null,encerrada:null};
        mapa[ch]=nt; idMap[t.id]=nt.id; n.tarefas.push(nt);
      }
    });
  }
  Object.keys(n.dias).forEach(function(k){
    var r=n.dias[k];
    ["feitos","falhos","avisados"].forEach(function(c){
      if(!r[c])return; var nv={};
      Object.keys(r[c]).forEach(function(id){
        var alvo=(id.charAt(0)==="p"&&idMap[id.slice(1)])?"p"+idMap[id.slice(1)]:(idMap[id]||id);
        nv[alvo]=r[c][id];
      });
      r[c]=nv;
    });
  });
  return n;
}

/* ===== datas ===== */
function kD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function kS(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+4-(x.getDay()||7));
  var a=new Date(x.getFullYear(),0,1);return x.getFullYear()+"-S"+String(Math.ceil(((x-a)/86400000+1)/7)).padStart(2,"0");}
function iniSem(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var g=x.getDay();x.setDate(x.getDate()-(g===0?6:g-1));return x;}
function br(k){var p=k.split("-");return p[2]+"/"+p[1];}
function hm(m){if(m==null)return"—";var h=Math.floor(m/60),x=Math.round(m%60);return h?h+"h"+(x?String(x).padStart(2,"0"):""):x+" min";}
function relogio(s){var m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function mins(h){var p=(h||"00:00").split(":");return (+p[0])*60+(+p[1]);}
function hhmm(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function ultimoDia(a,m){return new Date(a,m+1,0).getDate();}

/* ===== recorrência ===== */
function alvoDoMes(ano,mes,rec){
  var dia=(rec.diaMes===0)?ultimoDia(ano,mes):Math.min(rec.diaMes,ultimoDia(ano,mes));
  var d=new Date(ano,mes,dia);
  if(rec.util){
    if(rec.diaMes===0){ while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1); }
    else{ while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1); }
  }
  return d;
}
function ocorreEm(t,d){
  var k=kD(d);
  if(t.encerrada&&k>=t.encerrada)return false;
  if(t.inicio&&k<t.inicio)return false;
  var r=t.rec||{tipo:"semanal",dias:[]};
  if(r.tipo==="semanal")return (r.dias||[]).indexOf(d.getDay())>=0;
  if(r.tipo==="mensal"){
    var cada=r.cada||1,an;
    if(r.ancora){var pa=r.ancora.split("-");an=new Date(+pa[0],+pa[1]-1,1);}
    else an=new Date(d.getFullYear(),d.getMonth(),1);
    var diff=(d.getFullYear()-an.getFullYear())*12+(d.getMonth()-an.getMonth());
    if(diff<0||diff%cada!==0)return false;
    return kD(alvoDoMes(d.getFullYear(),d.getMonth(),r))===k;

/* ===== registros ===== */
function rDia(k){
  if(!D.dias[k])D.dias[k]={feitos:{},falhos:{},min:false,nota:"",prio:["","",""],extras:[],avisados:{},excecoes:{}};
  var r=D.dias[k];
  if(!r.feitos)r.feitos={}; if(!r.falhos)r.falhos={}; if(!r.prio)r.prio=["","",""];
  if(!r.extras)r.extras=[]; if(!r.avisados)r.avisados={}; if(!r.excecoes)r.excecoes={};
  for(var i in r.feitos){ if(typeof r.feitos[i]==="string")r.feitos[i]={h:r.feitos[i],m:null}; }
  return r;
}
function rSem(k){if(!D.semanas[k])D.semanas[k]={ritual:{},prio:["","",""],evitar:""};return D.semanas[k];}
function cat(id){for(var i=0;i<D.categorias.length;i++)if(D.categorias[i].id===id)return D.categorias[i];
  return{id:id||"--",nome:"Sem categoria",cor:"#5D6862"};}
function acharT(id){for(var i=0;i<D.tarefas.length;i++)if(D.tarefas[i].id===id)return D.tarefas[i];return null;}

function tarefasDe(d){
  var k=kD(d),r=D.dias[k],out=[];
  D.tarefas.forEach(function(t){
    if(!ocorreEm(t,d))return;
    var ex=(r&&r.excecoes)?r.excecoes[t.id]:null;
    if(ex==="pular")return;
    if(ex&&ex.hora)out.push({id:t.id,titulo:t.titulo,hora:ex.hora,dur:t.dur,cat:t.cat,minimo:t.minimo,projeto:t.projeto,movida:true});
    else out.push(t);
  });
  if(r&&r.extras)out=out.concat(r.extras);
  out.sort(function(a,b){return (a.hora||"99:99").localeCompare(b.hora||"99:99");});
  return out;
}
function puladasDe(d){
  var r=D.dias[kD(d)]; if(!r||!r.excecoes)return[];
  var out=[];
  Object.keys(r.excecoes).forEach(function(id){
    if(r.excecoes[id]!=="pular")return;
    var t=acharT(id); if(t&&ocorreEm(t,d))out.push(t);
  });
  return out;
}
function temRotina(){return D.tarefas.some(function(t){return !t.encerrada;});}

function prog(d){
  var ts=tarefasDe(d),r=D.dias[kD(d)];
  if(!ts.length)return{f:0,n:0,t:0,pct:0,min:false,ok:false};
  var f=0,n=0;
  if(r)for(var i=0;i<ts.length;i++){ if(r.feitos[ts[i].id])f++; else if(r.falhos[ts[i].id])n++; }
  var pct=Math.round(f/ts.length*100),min=!!(r&&r.min);
  return{f:f,n:n,t:ts.length,pct:pct,min:min,ok:min?pct>=30:pct>=60};
}
function seq(){var n=0,d=new Date();if(!prog(d).ok)d.setDate(d.getDate()-1);
  for(var i=0;i<370;i++){if(!D.dias[kD(d)]||!prog(d).ok)break;n++;d.setDate(d.getDate()-1);}return n;}
function pctSemDe(ref){
  var ini=iniSem(ref),hoje=kD(new Date()),t=0,ok=0;
  for(var i=0;i<7;i++){
    var d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i);
    if(kD(d)>hoje)break; if(!tarefasDe(d).length)continue;
    t++; if(prog(d).ok)ok++;
  }
  return{pct:t?Math.round(ok/t*100):0,dias:t};
}

/* ===== conflitos e vagas ===== */
function fimDe(t){return hhmm(mins(t.hora)+(t.dur||0));}
function choca(a,b){ if(!a.dur||!b.dur)return false;
  var ai=mins(a.hora),af=ai+a.dur,bi=mins(b.hora),bf=bi+b.dur; return ai<bf&&bi<af; }
function datasDe(t,n){
  var out=[],d=new Date();
  for(var i=0;i<(n||120)&&out.length<12;i++){ if(ocorreEm(t,d))out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function conflitosDe(alvo,ignora){
  if(!alvo.dur)return[];
  var achados={},datas=datasDe(alvo,400);
  datas.forEach(function(d){
    D.tarefas.forEach(function(x){
      if(x.id===ignora||x.id===alvo.id||x.encerrada)return;
      if(!ocorreEm(x,d))return;
      if(choca(x,alvo))achados[x.id]={t:x,quando:DIAS_C[d.getDay()]};
    });
  });
  return Object.keys(achados).map(function(k){return achados[k];});
}
function proximoLivre(alvo,ignora){
  var m=mins(alvo.hora),dur=alvo.dur||0;
  if(!dur)return alvo.hora;
  for(var k=0;k<200;k++){
    var teste={id:alvo.id,hora:hhmm(m),dur:dur,rec:alvo.rec,inicio:alvo.inicio,encerrada:alvo.encerrada};
    var c=conflitosDe(teste,ignora);
    if(!c.length)return hhmm(m);
    var fim=0; c.forEach(function(o){ fim=Math.max(fim,mins(o.t.hora)+(o.t.dur||0)); });
    if(fim<=m)return null;
    m=fim; if(m+dur>1440)return null;
  }
  return null;
}
function vagasDe(d,minLivre){
  var ts=tarefasDe(d).filter(function(t){return t.dur;}),out=[],cursor=5*60,limite=23*60;
  ts.forEach(function(t){
    var i=mins(t.hora),f=i+t.dur;
    if(i-cursor>=(minLivre||30))out.push({ini:cursor,fim:i});
    cursor=Math.max(cursor,f);
  });
  if(limite-cursor>=(minLivre||30))out.push({ini:cursor,fim:limite});
  return out;
}

function analise(nDias){
  var fim=new Date(),r={dias:0,diasOk:0,diasMin:0,feitas:0,falhas:0,total:0,porCat:{},
    porPeriodo:{"Manhã":{f:0,t:0},"Tarde":{f:0,t:0},"Noite":{f:0,t:0}},
    motivos:{},topFalhas:{},imprevistos:[],puladas:0,minPrev:0,minReal:0,notas:[],inicio:"",fim:kD(fim)};
  for(var i=nDias-1;i>=0;i--){
    var d=new Date(fim.getFullYear(),fim.getMonth(),fim.getDate()-i),k=kD(d);
    if(i===nDias-1)r.inicio=k;
    var ts=tarefasDe(d); if(!ts.length)continue;
    var reg=D.dias[k]; if(!reg)continue;
    r.dias++;
    var pr=prog(d); if(pr.ok)r.diasOk++; if(pr.min)r.diasMin++;
    if(reg.excecoes)r.puladas+=Object.keys(reg.excecoes).filter(function(x){return reg.excecoes[x]==="pular";}).length;
    if(reg.nota&&reg.nota.trim())r.notas.push(br(k)+": "+reg.nota.trim());
    ts.forEach(function(t){
      r.total++;
      var c=cat(t.cat).nome,per=grupoDe(t.hora);
      if(!r.porCat[c])r.porCat[c]={f:0,t:0,n:0,prev:0,real:0,tarefas:{}};
      var pc=r.porCat[c]; pc.t++; r.porPeriodo[per].t++;
      pc.prev+=(t.dur||0); r.minPrev+=(t.dur||0);
      var chave=t.imprevisto?"⚡ imprevistos":(t.titulo+(t.hora?" ("+t.hora+")":""));
      if(!pc.tarefas[chave])pc.tarefas[chave]={f:0,t:0,n:0,real:0,mot:{}};
      var td=pc.tarefas[chave]; td.t++;
      var f=reg.feitos[t.id];
      if(f){ r.feitas++; pc.f++; td.f++; r.porPeriodo[per].f++;
        if(f.m){pc.real+=f.m;td.real+=f.m;r.minReal+=f.m;} }
      else if(reg.falhos[t.id]){
        r.falhas++; pc.n++; td.n++;
        var mo=reg.falhos[t.id].motivo||"Sem motivo";
        r.motivos[mo]=(r.motivos[mo]||0)+1; td.mot[mo]=(td.mot[mo]||0)+1;
        var ch=t.titulo+" ("+(t.hora||"")+")";
        if(!r.topFalhas[ch])r.topFalhas[ch]={n:0,mot:{}};
        r.topFalhas[ch].n++; r.topFalhas[ch].mot[mo]=(r.topFalhas[ch].mot[mo]||0)+1;
      }
      if(t.imprevisto)r.imprevistos.push({data:br(k),titulo:t.titulo,dur:t.dur||0,cat:c});
    });
  }
  r.semanas=Math.max(1,nDias/7);
  return r;
}

function copiar(ta,btn){
  ta.removeAttribute("readonly"); ta.select();
  try{ta.setSelectionRange(0,999999);}catch(x){}
  var ok=false; try{ok=document.execCommand("copy");}catch(x){}
  try{ if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(function(){},function(){}); }catch(x){}
  ta.setAttribute("readonly","readonly");
  if(btn)btn.textContent=ok?"Copiado":"Selecione e copie";
}
function baixar(nome,txt){
  try{
    var b=new Blob([txt],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=nome;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},400);
  }catch(e){alert("Não deu para baixar aqui. Copie o texto manualmente.");}
}

function mapaParaIA(){
  var L=[];
  L.push("Abaixo está minha rotina atual, com os horários ocupados e as vagas livres.");
  L.push("");
  L.push("QUERO ENCAIXAR: (escreva aqui — demanda nova de trabalho, hobby, habilidade, estudo)");
  L.push("");
  L.push("Me devolva SÓ um bloco JSON, sem texto antes ou depois, neste formato:");
  L.push('[{"titulo":"","hora":"HH:MM","dur":30,"cat":"ES","minimo":"","freq":"semanal","dias":[1,3,5],"projeto":false}]');
  L.push("");
  L.push("Regras:");
  L.push("- cat: use um dos códigos da lista de categorias abaixo.");
  L.push("- dias: 0=Dom, 1=Seg ... 6=Sáb (só quando freq=semanal).");
  L.push('- Mensal/trimestral: "freq":"mensal","diaMes":1,"cada":1 (cada:3 = trimestral; diaMes:0 = último dia do mês; "util":true empurra para dia útil).');
  L.push("- projeto:true quando for algo que um dia termina; false quando for rotina permanente.");
  L.push("- minimo: a versão de 2 minutos da tarefa, para os dias ruins.");
  L.push("- NÃO use horários já ocupados. Prefira as vagas livres listadas.");
  L.push("- No máximo 3 tarefas novas por vez, e nunca deixe um dia passar de 12 tarefas.");
  L.push("- Olhe onde eu já falho antes de escolher horário.");
  L.push("");
  L.push("## Categorias disponíveis");
  D.categorias.forEach(function(c){L.push("- "+c.id+" = "+c.nome);});
  L.push("");
  L.push("## Rotina semanal atual");
  var hoje=new Date(),ini=iniSem(hoje);
  ORDEM.forEach(function(g){
    var d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+(g===0?6:g-1));
    L.push("");
    L.push("### "+DIAS_L[g]);
    var ts=D.tarefas.filter(function(t){
      if(t.encerrada||!t.rec)return false;
      if(t.rec.tipo==="semanal")return t.rec.dias.indexOf(g)>=0;
      return ocorreEm(t,d);
    }).sort(function(a,b){return a.hora.localeCompare(b.hora);});
    if(!ts.length)L.push("(dia livre)");
    ts.forEach(function(t){L.push(t.hora+"–"+fimDe(t)+" "+t.titulo+" ["+t.cat+"]"
      +(t.rec.tipo==="mensal"?" (mensal: "+descreveRec(t)+")":"")+(t.projeto?" (até finalizar)":""));});
    var vg=vagasDe(d,45);
    if(vg.length)L.push("LIVRE: "+vg.map(function(v){return hhmm(v.ini)+"–"+hhmm(v.fim);}).join(", "));
  });
  var men=D.tarefas.filter(function(t){return !t.encerrada&&t.rec&&t.rec.tipo==="mensal";});
  if(men.length){
    L.push(""); L.push("## Mensais e trimestrais");
    men.forEach(function(t){L.push("- "+t.titulo+" ["+t.cat+"] "+t.hora+"–"+fimDe(t)+" · "+descreveRec(t));});
  }
  var a=analise(28);
  if(a.dias){
    L.push(""); L.push("## Como estou indo (últimos 28 dias)");
    Object.keys(a.porCat).forEach(function(c){var o=a.porCat[c];
      L.push("- "+c+": "+Math.round(o.f/o.t*100)+"% de aderência");});
    var tf=Object.keys(a.topFalhas).sort(function(x,y){return a.topFalhas[y].n-a.topFalhas[x].n;}).slice(0,5);
    if(tf.length){
      L.push(""); L.push("## Onde eu mais falho (evite empilhar coisa nova nesses horários)");
      tf.forEach(function(t){L.push("- "+t+": "+a.topFalhas[t].n+" vezes");});
    }
    if(a.imprevistos.length)
      L.push("- Imprevistos: cerca de "+(a.imprevistos.length/a.semanas).toFixed(1)+" por semana. Deixe folga.");
  }
  return L.join("\n");
}

function formImportar(){

      if(!o||!o.titulo||!o.hora)return;

        cada:parseInt(o.cada,10)||1,util:!!o.util,ancora:mesAtual};

        var ds=(o.dias||[1]).map(Number).filter(function(x){return x>=0&&x<=6;});

      }
      var t={id:uid(),titulo:String(o.titulo).slice(0,90),hora:String(o.hora).slice(0,5),dur:parseInt(o.dur,10)||30,
        cat:c,minimo:o.minimo?String(o.minimo).slice(0,60):"",projeto:!!o.projeto,rec:rec,inicio:null,encerrada:null};
      validas.push({t:t,ok:true,conf:conflitosDe(t,null)});

    validas.forEach(function(v){
      var L=el("div",{class:"statLinha"});

      L.appendChild(el("div",{class:"meta"},[b]));
      prev.appendChild(L);
    });
    var add=el("div",{class:"acoes"});
    add.appendChild(el("button",{class:"btn cheio",text:"Adicionar as marcadas",onclick:function(){
      var n=0; validas.forEach(function(v){if(v.ok){D.tarefas.push(v.t);n++;}});
      form=null;salvar();render();
      if(n)setTimeout(function(){alert(n+" tarefa(s) adicionada(s). Confira na aba Rotina.");},80);
    }}));
    prev.appendChild(add);
  }}));
  ac.appendChild(el("button",{class:"btn leve",text:"Cancelar",onclick:function(){form=null;render();}}));
  f.appendChild(ac);
  return f;
}

  ac.appendChild(el("button",{class:"btn leve",text:"Exportar",onclick:function(){baixar("agenda-backup-"+kD(new Date())+".json",JSON.stringify(D));}}));
  ac.appendChild(el("button",{class:"btn leve",text:"Restaurar",onclick:function(){form=form==="rest"?null:"rest";render();}}));
  c.appendChild(ac);
  if(form==="rest"){
    var txt="",f=el("div",{class:"form"});
    f.appendChild(el("h4",{text:"Colar backup"}));
    f.appendChild(el("textarea",{placeholder:"cole o conteúdo do .json",oninput:function(e){txt=e.target.value;}}));
    var a2=el("div",{class:"acoes"});
    a2.appendChild(el("button",{class:"btn cheio",text:"Restaurar",onclick:function(){
      var n=null;
      try{ n=JSON.parse(txt); if(n.rotina&&!n.tarefas)n=migrar(n); }catch(x){n=null;}
      if(!n||!n.tarefas||!n.categorias){alert("Arquivo inválido.");return;}
      if(!confirm("Isso substitui tudo que está no aparelho. Continuar?"))return;
      D=n; if(!D.dias)D.dias={}; if(!D.semanas)D.semanas={}; if(!D.avisos)D.avisos={ativo:false,antes:5};
      form=null;salvar();render();
    }}));
    a2.appendChild(el("button",{class:"btn leve",text:"Cancelar",onclick:function(){form=null;render();}}));
    f.appendChild(a2); c.appendChild(f);
  }
  var lim=el("div",{class:"acoes"});
  lim.appendChild(el("button",{class:"btn leve largo",text:"Apagar tudo",onclick:function(){
    if(confirm("Isso apaga a rotina e todo o histórico. Continuar?")){D=vazio();salvar();aba="hoje";render();}}}));
  c.appendChild(lim);
  return c;
}

function relatorio(a){
  var L=[];
  L.push("Analise meus dados de rotina abaixo e me diga, de forma direta: onde estou perdendo tempo, quais tarefas eu deveria mover de horário ou cortar, e o que ajustar na próxima semana. Não me elogie; aponte os padrões.");
  L.push("");
  L.push("# Relatório de rotina");
  L.push("Período: "+br(a.inicio)+" a "+br(a.fim)+" ("+periodo+" dias)");
  L.push("");
  L.push("## Resumo");
  L.push("- Dias com rotina ativa: "+a.dias);
  L.push("- Dias registrados (meta atingida): "+a.diasOk+" ("+(a.dias?Math.round(a.diasOk/a.dias*100):0)+"%)");
  L.push("- Dias em modo mínimo: "+a.diasMin);
  L.push("- Tarefas cumpridas: "+a.feitas+" de "+a.total+" ("+(a.total?Math.round(a.feitas/a.total*100):0)+"%)");
  L.push("- Marcadas como não cumpridas: "+a.falhas+" | puladas de propósito: "+a.puladas);
  L.push("- Tempo previsto: "+hm(a.minPrev)+" | cronometrado: "+hm(a.minReal));
  var cats=Object.keys(a.porCat).sort(function(x,y){return a.porCat[y].t-a.porCat[x].t;});
  L.push(""); L.push("## Aderência por categoria");
  cats.forEach(function(c){var o=a.porCat[c];
    L.push("- "+c+": "+Math.round(o.f/o.t*100)+"% ("+o.f+"/"+o.t+")"+(o.n?" · "+o.n+" não cumpridas":"")+" · previsto "+hm(o.prev)+(o.real?" · cronometrado "+hm(o.real):""));});
  L.push(""); L.push("## Detalhe de cada categoria");
  cats.forEach(function(c){
    var o=a.porCat[c];
    L.push(""); L.push("### "+c+" — "+Math.round(o.f/o.t*100)+"% ("+o.f+"/"+o.t+")");
    L.push("Tempo previsto "+hm(o.prev)+(o.real?", cronometrado "+hm(o.real):", nada cronometrado"));
    Object.keys(o.tarefas).sort(function(x,y){return o.tarefas[y].t-o.tarefas[x].t;}).forEach(function(tt){
      var d=o.tarefas[tt],mots=Object.keys(d.mot);
      L.push("- "+tt+": "+Math.round(d.f/d.t*100)+"% ("+d.f+"/"+d.t+")"+(d.real?" · "+hm(d.real)+" cronometrados":"")
        +(mots.length?" · não deu por "+mots.map(function(m){return m+" ("+d.mot[m]+")";}).join(", "):""));
    });
  });
  L.push(""); L.push("## Aderência por período do dia");
  ["Manhã","Tarde","Noite"].forEach(function(k){var o=a.porPeriodo[k];if(!o.t)return;
    L.push("- "+k+": "+Math.round(o.f/o.t*100)+"% ("+o.f+"/"+o.t+")");});
  var tf=Object.keys(a.topFalhas).sort(function(x,y){return a.topFalhas[y].n-a.topFalhas[x].n;}).slice(0,8);
  if(tf.length){
    L.push(""); L.push("## Tarefas que mais ficam para trás");
    tf.forEach(function(t){var o=a.topFalhas[t];
      L.push("- "+t+": "+o.n+" vezes — motivos: "+Object.keys(o.mot).map(function(m){return m+" ("+o.mot[m]+")";}).join(", "));});
  }
  var mk=Object.keys(a.motivos);
  if(mk.length){
    L.push(""); L.push("## Motivos declarados");
    mk.sort(function(x,y){return a.motivos[y]-a.motivos[x];}).forEach(function(m){L.push("- "+m+": "+a.motivos[m]);});
  }
  if(a.imprevistos.length){
    var tot=a.imprevistos.reduce(function(s,x){return s+x.dur;},0);
    L.push(""); L.push("## Imprevistos (tarefas que chegaram do nada)");
    L.push("- Total: "+a.imprevistos.length+" ("+hm(tot)+")");
    L.push("- Média por semana: "+(a.imprevistos.length/a.semanas).toFixed(1)+" ocorrências, "+hm(Math.round(tot/a.semanas)));
    var pc={}; a.imprevistos.forEach(function(x){pc[x.cat]=(pc[x.cat]||0)+1;});
    L.push("- Por categoria: "+Object.keys(pc).map(function(c){return c+" ("+pc[c]+")";}).join(", "));
    L.push("- Últimos:");
    a.imprevistos.slice(-10).forEach(function(x){L.push("  - "+x.data+" — "+x.titulo+(x.dur?" ("+x.dur+" min)":""));});
  }
  if(a.notas.length){
    L.push(""); L.push("## O que atrapalhou (anotações do dia)");
    a.notas.slice(-15).forEach(function(n){L.push("- "+n);});
  }
  var s=D.semanas[kS(new Date())];
  if(s&&(s.prio.some(function(x){return x;})||s.evitar)){
    L.push(""); L.push("## Prioridades da semana atual");
    s.prio.forEach(function(x,i){if(x)L.push("- "+(i+1)+". "+x);});
    if(s.evitar)L.push("- Decidi não fazer: "+s.evitar);
  }
  L.push(""); L.push("## Como leio os números");
  L.push("Um dia conta como registrado com 60% das tarefas, ou 30% no modo dia difícil. A meta da semana é 70% dos dias, não 100%.");
  return L.join("\n");
}

function iniciar(){
  if(!D.dias)D.dias={}; if(!D.semanas)D.semanas={}; if(!D.tarefas)D.tarefas=[];
  if(!D.categorias||!D.categorias.length)D.categorias=CATS_BASE.slice();
  if(!D.avisos)D.avisos={ativo:false,antes:5};
  if(D.avisos.ativo&&!liberado())D.avisos.ativo=false;
  if(D.timer&&D.timer.dia&&D.timer.dia!==kD(new Date()))D.timer=null;
  render();
}
Store.ler(CHAVE).then(function(txt){
  var d=null; try{d=txt?JSON.parse(txt):null;}catch(e){}
  if(d&&d.tarefas&&d.categorias){ D=d; iniciar(); return null; }
  return Store.ler("minha-agenda-v2").then(function(velho){
    var v=null; try{v=velho?JSON.parse(velho):null;}catch(e){}
    if(v&&v.rotina&&v.categorias){ D=migrar(v); iniciar(); salvar(); }
    else { D=vazio(); iniciar(); }
  });
}).catch(function(e){console.error(e);D=vazio();iniciar();});
